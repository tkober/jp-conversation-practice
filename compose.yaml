# Local end-to-end stack: Postgres + backend + nginx frontend on :8085.
#
# It mirrors the deployment (see the jp_conversation_practice stack in
# compose-stacks-unraid) down to the two Postgres roles — dev/initdb creates
# them, so the owner/app split is exercised here and not only in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jp_conversation
      TZ: Europe/Berlin
    volumes:
      - jp-conversation-db:/var/lib/postgresql/data
      - ./dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jp_conversation"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: postgresql://postgres:5432/jp_conversation
      DB_USER: jp_conversation_app
      DB_PASSWORD: jp_conversation
      DB_OWNER_USER: jp_conversation_owner
      DB_OWNER_PASSWORD: jp_conversation
      # Supply your key here or set it in the app's Settings screen, which
      # stores it in the database and takes precedence.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # The image default points at the deployment's container name; locally
      # the backend answers to its compose service name.
      API_UPSTREAM: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8085:80"
    restart: unless-stopped

volumes:
  jp-conversation-db:
