[project]
name = "jp-conversation-backend"
version = "0.1.0"
description = "Backend for the Japanese AI conversation practice and Anki generator PoC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "python-frontmatter>=1.1",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "aiosqlite>=0.22.1",
    # Multipart form parsing, for the context material upload.
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the SQLAlchemy engine is created once and
# a per-test loop would leave it bound to a loop that is already closed.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
