name: Build frontend Docker image

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/publish-frontend.yml"
      - ".gitmodules"
    tags: ["v*.*.*"]

  # A PR build with no push: there is no Docker in this dev environment, so a
  # broken Dockerfile would otherwise only surface once it lands on main.
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/publish-frontend.yml"
      - ".gitmodules"

  # Lets the image be rebuilt without a code change — useful after a base
  # image update, and the way to recover when a push carried no usable diff
  # (a force push with unrelated history leaves the paths filter unmatched,
  # so no run is queued at all).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # QEMU lets buildx produce the arm64 variant on this amd64 runner (Apple
      # Silicon Macs, issue tkober/compose-stacks-unraid#19).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Skipped on a PR: it carries no credentials to push with, and GHCR
      # login is pointless (and would fail for a fork PR) when nothing below
      # pushes anyway.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tkober/jp-conversation-practice-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          # Build-only on a PR, so a broken Dockerfile shows up in the PR
          # instead of only failing once it reaches main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
