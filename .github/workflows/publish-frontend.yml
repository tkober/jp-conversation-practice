name: Build frontend Docker image

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/publish-frontend.yml"
    tags: ["v*.*.*"]

  # Lets the image be rebuilt without a code change — useful after a base
  # image update, and the way to recover when a push carried no usable diff
  # (a force push with unrelated history leaves the paths filter unmatched,
  # so no run is queued at all).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tkober/jp-conversation-practice-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
