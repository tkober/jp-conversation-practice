server {
    # The listen port is substituted by nginx's envsubst-on-templates
    # entrypoint at startup (default 80, see the Dockerfile). $uri/$host below
    # survive it — envsubst only replaces variables that exist in the
    # environment. Note it rewrites comments too, so this file avoids spelling
    # out the substituted variable names.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved periodically: going through a variable
    # defers resolution to request time, so recreating the backend container
    # (new IP) doesn't strand nginx on a stale address.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Backend API, reverse-proxied so the SPA can call it same-origin. The
    # browser then always talks to whatever address it loaded the page from —
    # LAN IP, mDNS name, VPN, reverse proxy — so no CORS is involved and the
    # backend port need not be published at all.
    location /api/ {
        set $api_upstream ${API_UPSTREAM};

        # No rewrite: this API already serves everything under /api, and a
        # proxy_pass without a URI part forwards the request URI unchanged.
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploading context material is a file, not a form field: nginx's
        # default 1 MB body limit would reject a phone photo with its own 413
        # long before the backend's message about the real limit could be
        # shown. Keep this at or above ATTACHMENT_MAX_BYTES.
        client_max_body_size 12m;

        # A voice preview is rendered on first request and can take a moment,
        # and so does describing an uploaded image: that call goes to a vision
        # model at high detail and answers inside the upload request.
        proxy_read_timeout 180s;
    }

    # The realtime relay. Unlike /api/ this must carry the Upgrade handshake
    # through, and must never time out while idle: a learner can spend minutes
    # listening without sending anything, and nginx's default 60s read timeout
    # would tear the conversation down mid-sentence.
    location /ws/ {
        set $ws_upstream ${API_UPSTREAM};
        proxy_pass http://$ws_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Audio frames must go out as they arrive, not be collected first.
        proxy_buffering off;
    }

    # SPA deep-link fallback: unknown paths serve index.html, which is what
    # makes a reload on /settings or /scenarios/3 work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
