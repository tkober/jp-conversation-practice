@switch (phase()) {
  @case ('setup') {
    <sumi-page
      [title]="setupStep() === 'details' ? setupPageTitle() : undefined"
      [inkEnd]="setupStep() === 'details'"
    >
      <app-setup (start)="onStart($event)" />
    </sumi-page>
  }
  @case ('connecting') {
    <sumi-page [inkEnd]="false">
      <app-conversation (finish)="onFinish()" />
    </sumi-page>
  }
  @case ('live') {
    <sumi-page [inkEnd]="false">
      <app-conversation (finish)="onFinish()" />
    </sumi-page>
  }
  @default {
    @if (phase() === 'analysing' && !reviewOpened()) {
      <!-- T2: the conversation's own end-of-session gate, not the review
           yet — "Show review" (or Enter once ready) is what opens it. -->
      <sumi-page [inkEnd]="false">
        <sumi-session-gate
          [showAction]="false"
          companion="kitsune"
          [actionDisabled]="!reviewReady()"
          (start)="openReview()"
        >
          <sumi-session-summary
            [durationMs]="finalElapsed() * 1000"
            headline="Conversation complete"
            [actionLabel]="reviewReady() ? 'Show review' : 'Analysing…'"
            [actionDisabled]="!reviewReady()"
            (restart)="openReview()"
          >
            <sumi-hanko sumiSummaryArt characters="完了" label="Conversation complete" />
            <div sumiSummaryTile label="Turns">{{ finalTurns() }}</div>
            <div sumiSummaryTile label="Cost">{{ finalCost() }}</div>
          </sumi-session-summary>
        </sumi-session-gate>
      </sumi-page>
    } @else {
      <sumi-page title="Review">
        <app-review
          [analysis]="analysis()"
          [analysisError]="analysisError()"
          [loading]="phase() === 'analysing'"
          [usage]="session.usage()"
          [transcript]="session.transcript()"
          [elapsedSeconds]="finalElapsed()"
          [sessionInfo]="session.sessionInfo()"
          (restart)="onRestart()"
          (retryAnalysis)="runAnalysis()"
        />
      </sumi-page>
    }
  }
}
