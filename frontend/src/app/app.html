<div class="shell">
  <nav class="nav">
    <a class="brand jp" routerLink="/">会話</a>

    <div class="links" [class.locked]="conversationRunning()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Üben
      </a>
      <a routerLink="/scenarios" routerLinkActive="active">Szenarien</a>
      <a routerLink="/history" routerLinkActive="active">Verlauf</a>

    </div>

    @if (conversationRunning()) {
      <span class="running" title="Beende die Session, bevor du wegnavigierst">
        Session läuft
      </span>
    }
  </nav>

  <router-outlet />
</div>
